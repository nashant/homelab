# Server-side secret scanning (detection; prevention is the local pre-commit/pre-push hooks).
# Actions are pinned to a commit SHA. --results covers unverified too, so a fresh key/token is
# caught, not only API-verifiable ones. The action adds --fail itself (do not repeat it here, the
# trufflehog flag parser rejects a duplicate), so a finding still fails the job.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly full-history sweep, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    # push and PR: scan only the commits in the event (fast)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --log-level=2 --results=verified,unverified,unknown

  full:
    # schedule and manual: scan the whole branch history
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --log-level=2 --results=verified,unverified,unknown
