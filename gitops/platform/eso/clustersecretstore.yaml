apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-west-2
      # No auth block: the ESO controller authenticates with its own
      # pod-injected IRSA credentials. AWS access is scoped by the IAM path
      # on the controller role (irsarole.yaml -> /k8s/*). Cluster-scoped so
      # every namespace's ExternalSecret/ClusterExternalSecret references it.
