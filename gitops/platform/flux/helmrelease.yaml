apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cilium
      version: 1.16.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1m
  values:
    autoDirectNodeRoutes: true
    bgpControlPlane:
      enabled: true
      announce:
        loadbalancerIP: true
    bpf:
      masquerade: false
    cluster:
      name: home
    enableIPv4Masquerade: false
    enableIPv6Masquerade: false
    endpointRoutes:
      enabled: false
    gatewayAPI:
      enabled: true
      gatewayClass:
        create: auto
    hubble:
      relay:
        enabled: true
      ui:
        enabled: false
    ingressController:
      enabled: true
    ipam:
      mode: multi-pool
      operator:
        clusterPoolIPv4PodCIDRList:
        - 172.30.0.0/16
        autoCreateCiliumPodIPPools:
          default:
            ipv4:
              cidrs:
              - 172.30.0.0/21
              maskSize: 27
          vpn:
            ipv4:
              cidrs:
              - 172.30.8.0/21
              maskSize: 27
    ipv4NativeRoutingCIDR: 172.30.0.0/16
    k8sServiceHost: 172.16.0.9
    k8sServicePort: 6443
    kubeProxyReplacement: true
    operator:
      replicas: 1
    routingMode: native
    tunnelProtocol: vxlan
