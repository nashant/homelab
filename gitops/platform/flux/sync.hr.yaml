apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-sync
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: fluxv2-sync
      version: 1.10.0
      sourceRef:
        kind: HelmRepository
        name: fluxcd
        namespace: flux-system
      interval: 1m
  values:
    gitRepository:
      spec:
        interval: 1m
        ref:
          branch: main
        secretRef:
          name: github-nashant
        url: ssh://git@github.com/nashant/home
    kustomization:
      spec:
        interval: 5m
        path: ./clusters/prod
        prune: true
