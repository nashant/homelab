# Flux Operator: installs and upgrades the Flux controllers from the FluxInstance in fluxinstance.yaml.
# It replaces the flux2 community Helm chart (helm CLI release "flux"). Bootstrap installs this same
# release with the helm CLI (clusters/prod/Makefile in the private repo), and this HelmRelease manages it
# after the Flux cutover.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  ref:
    tag: 0.62.1
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  interval: 10m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  values:
    priorityClassName: platform-high
    # The web UI is off. Its default NetworkPolicy admits port 9080 from every namespace, and the
    # operator runs as cluster-admin. Enable it only with an auth config and a private route.
    web:
      enabled: false
      networkPolicy:
        create: false
