apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-tier-move
  namespace: seaweedfs
spec:
  # Hourly. Moves a hot (ssd) volume to cold (hdd) 48h after its last write,
  # so no data younger than 48h leaves the 2-replica hot tier. A delete also
  # counts as a write; Thanos writes straight to hdd instead (RUNBOOK.md).
  # fullPercent=0 lets partly filled volumes move (the default 95% skips them).
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: tier-move
            image: chrislusf/seaweedfs:4.52
            # volume.tier.move requires the exclusive admin lock first.
            command:
            - sh
            - -c
            - |
              printf 'lock\nvolume.tier.move -fromDiskType=ssd -toDiskType=hdd -fullPercent=0 -quietFor=48h -apply\nunlock\n' \
                | weed shell -master=seaweedfs-master.seaweedfs:9333
