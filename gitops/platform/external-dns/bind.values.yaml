priorityClassName: platform-high
policy: sync
extraArgs:
- --rfc2136-host=172.31.0.53   # in-cluster BIND (platform/bind)
- --rfc2136-port=53
- --rfc2136-zone=nashes.uk
- --domain-filter=nashes.uk
- --rfc2136-zone=23oak.uk
- --domain-filter=23oak.uk
- --rfc2136-tsig-secret-alg=hmac-sha256
- --rfc2136-tsig-keyname=external-dns
# Enable AXFR zone-transfer reads so external-dns sees current records instead
# of re-UPSERTing all of them every cycle; also required for record DELETION
# (prunes orphans like renamed/removed hosts).
- --rfc2136-tsig-axfr
- --source=service
- --ingress-class=private-traefik
provider:
  name: rfc2136
env:
# Generated by the bind tsig init container (platform/bind/helmrelease.yaml)
- name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
  valueFrom:
    secretKeyRef:
      name: bind-tsig
      key: secret
