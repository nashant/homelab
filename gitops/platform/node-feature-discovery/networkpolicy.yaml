# Policies for node-feature-discovery; the default deny is cluster-wide
# (platform/cilium/default-deny.ccnp.yaml). The master, workers and garbage collector only talk to
# the API server (NodeFeature objects and node labels).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apiserver
  namespace: node-feature-discovery
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock: {cidr: 172.16.0.10/32}
    - ipBlock: {cidr: 172.16.0.12/32}
    - ipBlock: {cidr: 172.16.0.13/32}
    ports:
    - {protocol: TCP, port: 6443}
