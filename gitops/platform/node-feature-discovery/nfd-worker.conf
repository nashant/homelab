core:
  sleepInterval: 0s
  labelSources: ["custom"]
sources:
  custom:
    - name: "coral"
      labels:
        "feature.node.kubernetes.io/coral-tpu": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["1ac1"] }
            device: { op: In, value: ["089a"] }

