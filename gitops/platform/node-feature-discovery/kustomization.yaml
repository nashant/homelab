apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/kubernetes-sigs/node-feature-discovery/deployment/overlays/default?ref=v0.16.0
- networkpolicy.yaml
configMapGenerator:
- name: nfd-worker-conf
  behavior: replace
  files:
  - nfd-worker.conf
patches:
- target:
    kind: DaemonSet
    name: nfd-worker
  patch: |-
    - op: add
      path: /spec/template/spec/priorityClassName
      value: platform-high
- target:
    kind: Deployment
    name: nfd-(master|gc)
  patch: |-
    - op: add
      path: /spec/template/spec/priorityClassName
      value: platform-high
