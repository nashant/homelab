apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radar
  namespace: radar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: private-traefik
    ports:
    - {protocol: TCP, port: 9280}
  egress:
  # API server, which pods reach on the node IPs
  - to:
    - ipBlock: {cidr: 172.16.0.10/32}
    - ipBlock: {cidr: 172.16.0.12/32}
    - ipBlock: {cidr: 172.16.0.13/32}
    ports:
    - {protocol: TCP, port: 6443}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - {protocol: TCP, port: 9090}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: hubble-relay
    ports:
    - {protocol: TCP, port: 4245}
