apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: oauth2-proxy-private
  namespace: oauth2-proxy
spec:
  ingressClassName: private-traefik
  rules:
  - host: oauth2.23oak.uk
    http: &http
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 80
        pathType: ImplementationSpecific
  - host: oauth2.nashes.uk
    http: *http
  tls:
  - hosts:
    - oauth2.23oak.uk
    - oauth2.nashes.uk
