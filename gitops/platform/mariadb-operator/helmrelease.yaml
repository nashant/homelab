apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: mariadb-operator
spec:
  interval: 5m
  dependsOn:
  - name: mariadb-operator-crds
  chart:
    spec:
      chart: mariadb-operator
      version: 26.6.0
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
      interval: 1m
  values:
    priorityClassName: platform-high
    # Upstream-recommended when Prometheus operator and cert-manager are present (both are).
    metrics:
      enabled: true
    certController:
      priorityClassName: platform-high
    webhook:
      priorityClassName: platform-critical
      cert:
        certManager:
          enabled: true
