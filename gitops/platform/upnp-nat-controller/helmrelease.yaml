apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: upnp-nat-controller
  namespace: upnp-nat-controller
spec:
  interval: 5m
  chart:
    spec:
      chart: upnp-nat-controller
      version: 0.2.0
      sourceRef:
        kind: HelmRepository
        name: nashant
        namespace: flux-system
      interval: 1m
  values:
    controller:
      serviceTypes:
      - LoadBalancer
      - ClusterIP
    image:
      # chart 0.2.0 appVersion is 0.2.0; pin 0.2.1 to match what is running
      tag: "0.2.1"
