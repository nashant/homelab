apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: upnp-nat-controller
  namespace: upnp-nat-controller
spec:
  interval: 5m
  chart:
    spec:
      chart: upnp-nat-controller
      version: 0.2.2
      sourceRef:
        kind: HelmRepository
        name: nashant
        namespace: flux-system
      interval: 1m
  values:
    controller:
      serviceTypes:
      - LoadBalancer
      - ClusterIP
