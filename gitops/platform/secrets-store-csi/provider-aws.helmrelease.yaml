apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secrets-store-csi-driver-provider-aws
  namespace: kube-system
spec:
  interval: 5m
  dependsOn:
  - name: secrets-store-csi-driver
    namespace: kube-system
  chart:
    spec:
      chart: secrets-store-csi-driver-provider-aws
      version: 3.1.1
      sourceRef:
        kind: HelmRepository
        name: aws-secrets-store-csi-provider
        namespace: flux-system
      interval: 1m
  values:
    # The driver is installed by the sibling HelmRelease above; disable the
    # bundled driver subchart (condition: secrets-store-csi-driver.install)
    # to avoid a double install.
    secrets-store-csi-driver:
      install: false
