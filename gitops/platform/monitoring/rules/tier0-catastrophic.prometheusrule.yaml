apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tier0-catastrophic
  namespace: monitoring
  labels:
    release: kube-prometheus
    tier: "0"
spec:
  groups:
  - name: tier0.catastrophic
    interval: 30s
    rules:
    - alert: APIServerUnreachable
      expr: absent(up{job="apiserver"} == 1)
      for: 3m
      labels:
        severity: catastrophic
      annotations:
        summary: Kubernetes API server is unreachable
        description: |
          Prometheus has lost every kube-apiserver scrape target for 3m+.
          The cluster control plane is unreachable.

    - alert: ClusterMajorityNotReady
      expr: count(kube_node_status_condition{condition="Ready",status="true"} == 1) < 2
      for: 5m
      labels:
        severity: catastrophic
      annotations:
        summary: Two or more nodes are NotReady simultaneously
        description: |
          Only {{ $value }} node(s) report Ready=true (need ≥2 of 3).
          Workloads may be unschedulable; Longhorn replicas at risk.
