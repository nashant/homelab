apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  23oak-uk.server: |
    23oak.uk:53 {
      errors
      cache 30
      forward . 172.31.0.53   # in-cluster BIND (platform/bind)
    }
  home.server: |
    home:53 {
      errors
      cache 30
      forward . 172.16.0.1
    }
  nashes-uk.server: |
    nashes.uk:53 {
      errors
      cache 30
      forward . 172.31.0.53   # in-cluster BIND (platform/bind)
    }
