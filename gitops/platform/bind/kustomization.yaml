apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bind
resources:
- namespace.yaml
- helmrelease.yaml
components:
- ../../components/app-template-defaults
# The Role that lets the tsig init container write Secret external-dns/bind-tsig lives in
# platform/external-dns (bind-tsig.rbac.yaml), since this kustomization forces namespace: bind.
