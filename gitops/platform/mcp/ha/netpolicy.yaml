# Egress: DNS and prod Home Assistant (hostNetwork, so reached as a node IP).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ha
spec:
  endpointSelector:
    matchLabels:
      app: ha
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports: [{port: "53", protocol: ANY}]
  - toEntities: [host, remote-node]
    toPorts:
    - ports: [{port: "8123", protocol: TCP}]
