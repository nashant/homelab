apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha
  labels:
    app: ha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ha
  template:
    metadata:
      labels:
        app: ha
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mcp
        image: ghcr.io/homeassistant-ai/ha-mcp:stable@sha256:600677bbd7574dfb59682e40d6945f73fcc8852d3684b3671506602473942448
        args: ["ha-mcp-web"]
        ports:
        - name: mcp
          containerPort: 8080
        env:
        - name: HOMEASSISTANT_URL
          value: http://homeassistant.automation.svc.cluster.local:8123
        - name: HOMEASSISTANT_TOKEN
          valueFrom:
            secretKeyRef: {name: ha, key: token}
        - name: MCP_PORT
          value: "8080"
        # The settings web UI can change tool permissions at runtime; the
        # agent can reach this pod, so it must not be able to reconfigure it.
        - name: HA_MCP_DISABLE_SETTINGS_UI
          value: "true"
        - name: HA_MCP_DISABLE_UPDATE_CHECK # no internet egress
          value: "true"
        - name: HA_MCP_CONFIG_DIR
          value: /tmp/ha-mcp
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests: {cpu: 20m, memory: 192Mi}
          limits: {memory: 768Mi}
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 30
      volumes:
      - {name: tmp, emptyDir: {}}
