# Grafana service-account token (Viewer) for mcp-grafana (../README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: grafana
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: /k8s/mcp/grafana-token
