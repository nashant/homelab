# MCP servers the opencode agent calls (one Deployment per server). Deliberately
# NOT one of opencode's edit namespaces (apps/opencode/rbac.yaml): the agent
# must not be able to mount these Secrets, exec in, or edit the policies.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
