# OPNsense API key for user opencode-mcp (../README.md), from SSM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: opnsense
    creationPolicy: Owner
  data:
  - secretKey: api-key
    remoteRef:
      key: /k8s/opnsense-mcp/api-key
  - secretKey: api-secret
    remoteRef:
      key: /k8s/opnsense-mcp/api-secret
