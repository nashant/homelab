apiVersion: apps/v1
kind: Deployment
metadata:
  name: opnsense
  labels:
    app: opnsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opnsense
  template:
    metadata:
      labels:
        app: opnsense
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mcp
        image: registry.nashes.uk/mcp-opnsense:0.4.1-3
        ports:
        - name: mcp
          containerPort: 8080
        env:
        - name: OPNSENSE_URL
          value: https://172.16.0.1/api
        - name: OPNSENSE_VERIFY_SSL # self-signed cert, no CA option upstream
          value: "false"
        - name: OPNSENSE_ALLOW_WRITES
          value: "true"
        - name: OPNSENSE_VERSION # skips detection (needs firmware rights); bump on major upgrade
          value: "26.7"
        - name: OPNSENSE_API_KEY
          valueFrom:
            secretKeyRef: {name: opnsense, key: api-key}
        - name: OPNSENSE_API_SECRET
          valueFrom:
            secretKeyRef: {name: opnsense, key: api-secret}
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests: {cpu: 20m, memory: 96Mi}
          limits: {memory: 384Mi}
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 30
      volumes:
      - {name: tmp, emptyDir: {}}
