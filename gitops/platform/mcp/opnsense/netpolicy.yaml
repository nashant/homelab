# Egress: the OPNsense API and nothing else. DNS to CoreDNS comes from the cluster-wide default
# (platform/cilium/default-deny.ccnp.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opnsense
spec:
  endpointSelector:
    matchLabels:
      app: opnsense
  egress:
  - toCIDR: [172.16.0.1/32]
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
