# Egress: the OPNsense web GUI/API only. DNS to CoreDNS comes from the cluster-wide default
# (platform/cilium/default-deny.ccnp.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opnsense-cert-sync
spec:
  podSelector:
    matchLabels:
      app: opnsense-cert-sync
  policyTypes: [Ingress, Egress]
  egress:
  - to:
    - ipBlock: {cidr: 172.16.0.1/32}
    ports:
    - {protocol: TCP, port: 443}
