# Dedicated cert rather than the traefik wildcard, so the wildcard key never sits on the firewall.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opnsense
spec:
  dnsNames:
  - opnsense.nashes.uk
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: opnsense-tls
