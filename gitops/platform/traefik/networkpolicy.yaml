# Policies for traefik; the default deny is cluster-wide (platform/cilium/default-deny.ccnp.yaml).
# Peers come from the 2026-10-30 traffic capture and the route backends. Traefik proxies to pods in
# many namespaces, so its egress to pods is open; each backend's own policy decides. Backends on the
# host network (endpoints on the node IPs) are listed by port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: [Ingress, Egress]
  ingress:
  # Entrypoints web, websecure and plex. Who can reach each load balancer IP is set on OPNsense
  # (public-traefik is port-forwarded, private-traefik is LAN only). Pods that resolve a hostname
  # to a load balancer IP come in as pods, so all pods are allowed too.
  - from:
    - ipBlock: {cidr: 0.0.0.0/0}
    - namespaceSelector: {}
    ports:
    - {protocol: TCP, port: 8000}
    - {protocol: TCP, port: 8443}
    - {protocol: TCP, port: 32400}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - {protocol: TCP, port: 9100}
  egress:
  - to:
    - namespaceSelector: {}
  # API server (providers: CRD, Ingress, Gateway API), and host-network backends: Home Assistant,
  # ESPHome, ep-configurator
  - to:
    - ipBlock: {cidr: 172.16.0.10/32}
    - ipBlock: {cidr: 172.16.0.12/32}
    - ipBlock: {cidr: 172.16.0.13/32}
    ports:
    - {protocol: TCP, port: 6443}
    - {protocol: TCP, port: 8123}
    - {protocol: TCP, port: 6052}
    - {protocol: TCP, port: 42069}
