# Default-deny for registry; each app gets only the peers seen in the 2026-10-28 traffic capture.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
  namespace: registry
spec:
  podSelector:
    matchLabels:
      app: registry
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: private-traefik
    ports:
    - {protocol: TCP, port: 5000}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - {protocol: TCP, port: 5001}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: seaweedfs
      podSelector:
        matchLabels:
          app.kubernetes.io/component: s3
    ports:
    - {protocol: TCP, port: 8333}
