# Prometheus's serviceMonitorSelector and serviceMonitorNamespaceSelector are both {} (checked
# live 2026-09-14), so this is picked up from the registry namespace without extra labels.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  selector:
    matchLabels:
      app: registry
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
