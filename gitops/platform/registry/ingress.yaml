apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  ingressClassName: private-traefik
  rules:
  - host: &host registry.nashes.uk
    http:
      paths:
      - pathType: ImplementationSpecific
        backend:
          service:
            name: registry
            port:
              name: http
  tls:
  - hosts:
    - *host
