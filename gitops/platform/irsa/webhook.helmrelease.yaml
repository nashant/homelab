apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pod-identity-webhook
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: amazon-eks-pod-identity-webhook
      version: 2.6.4
      sourceRef:
        kind: HelmRepository
        name: jkroepke
        namespace: flux-system
      interval: 1m
  values:
    priorityClassName: platform-critical
    config:
      tokenAudience: sts.amazonaws.com
    # HA: the webhook injects IRSA creds at pod admission with failurePolicy=Ignore,
    # so a single replica is a SPOF — if its node reboots, IRSA pods that reschedule
    # in that window come up unmutated and silently fall back to (nonexistent) IMDS.
    # This bit the whole cluster on 2026-06-05; see docs/cluster-audit-2026-06-05.md #22.
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: amazon-eks-pod-identity-webhook
              app.kubernetes.io/instance: pod-identity-webhook
