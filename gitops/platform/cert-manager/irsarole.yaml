apiVersion: platform.nashes.uk/v1alpha1
kind: IRSARole
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  roleName: cert-manager
  oidcProvider: 23oak-k8s-oidc.s3.eu-west-2.amazonaws.com
  serviceAccounts:
  - cert-manager
  policies:
    route53: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": "route53:GetChange",
            "Resource": "arn:aws:route53:::change/*"
          },
          {
            "Effect": "Allow",
            "Action": [
              "route53:ChangeResourceRecordSets",
              "route53:ListResourceRecordSets"
            ],
            "Resource": "arn:aws:route53:::hostedzone/*"
          },
          {
            "Effect": "Allow",
            "Action": [
              "route53:ListHostedZones",
              "route53:ListHostedZonesByName"
            ],
            "Resource": "*"
          }
        ]
      }
