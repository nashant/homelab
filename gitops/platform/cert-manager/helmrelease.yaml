apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      version: 1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1m
  values:
    # cert-manager only exposes a single global priority class (no per-component key);
    # webhook needs platform-critical so it applies to the whole release.
    global:
      priorityClassName: platform-critical
    installCRDs: true
    dns01RecursiveNameservers: 8.8.8.8:53,8.8.4.4:53
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::079357235350:role/cert-manager
