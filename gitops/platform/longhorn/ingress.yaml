apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-private
  namespace: longhorn-system
spec:
  ingressClassName: private-traefik
  rules:
  - host: longhorn.23oak.uk
    http: &http
      paths:
      - backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
        pathType: ImplementationSpecific
  - host: longhorn.nashes.uk
    http: *http
  tls:
  - hosts:
    - longhorn.23oak.uk
    - longhorn.nashes.uk
