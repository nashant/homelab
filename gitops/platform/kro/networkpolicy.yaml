# Policies for kro; the default deny is cluster-wide (platform/cilium/default-deny.ccnp.yaml). The
# HelmRelease is suspended and no pods run, so nothing was captured. kro is a controller that only
# needs the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apiserver
  namespace: kro
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock: {cidr: 172.16.0.10/32}
    - ipBlock: {cidr: 172.16.0.12/32}
    - ipBlock: {cidr: 172.16.0.13/32}
    ports:
    - {protocol: TCP, port: 6443}
