# Cluster-wide default deny for every pod, plus DNS to CoreDNS; namespaces add allow rules as
# standard NetworkPolicies. Excludes opencode and octo-sts (their toFQDNs DNS-proxy path must not
# gain a plain DNS allow; they keep a standard default-deny) and Cilium's reserved endpoints, which
# have no namespace.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector:
    matchExpressions:
    - {key: k8s:io.kubernetes.pod.namespace, operator: Exists}
    - {key: k8s:io.kubernetes.pod.namespace, operator: NotIn, values: [opencode, octo-sts]}
  ingress:
  # The rule opens the ingress section, so every selected pod is default-deny for ingress. Cilium
  # always allows the local node (kubelet probes), so the rule itself adds nothing.
  - fromEntities: [host]
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - {port: "53", protocol: UDP}
      - {port: "53", protocol: TCP}
