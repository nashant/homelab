# Everything under gitops/apps. The apps need the platform first: the app-template chart source,
# the operators' CRDs, External Secrets and the ingress controllers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  path: ./gitops/apps
  prune: true
  wait: false
  dependsOn:
  - name: platform
  sourceRef:
    kind: GitRepository
    name: flux-system
