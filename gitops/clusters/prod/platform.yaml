# Everything under gitops/platform, including Flux itself (platform/flux).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  path: ./gitops/platform
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
