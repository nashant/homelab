apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
- ./helmrelease.yaml
- ./plex-exporter-es.yaml
components:
- ../../../components/app-template-defaults

# Grafana's dashboard sidecar loads any ConfigMap labelled grafana_dashboard=1.
# grafana-dashboard.json is the release asset matching the image tag; bump both together.
configMapGenerator:
- name: plex-exporter-grafana-dashboard
  files:
  - plex-exporter.json=grafana-dashboard.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
