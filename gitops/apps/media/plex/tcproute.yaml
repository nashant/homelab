apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: plex
  namespace: media
spec:
  parentRefs:
  - name: public-traefik
    namespace: traefik
    sectionName: plex
  - name: private-traefik
    namespace: traefik
    sectionName: plex
  rules:
  - backendRefs:
    - name: plex
      port: 32400
