---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.tls.options: automation-ha-http1-only@kubernetescrd
  name: homeassistant-dev-private
  namespace: automation
spec:
  ingressClassName: private-traefik
  rules:
    - host: homeassistant-dev.nashes.uk
      http:
        paths:
          - backend:
              service:
                name: homeassistant-dev
                port:
                  name: http
            pathType: ImplementationSpecific
          - backend:
              service:
                name: homeassistant-dev
                port:
                  name: ha-mcp
            path: /mcp
            pathType: Prefix
  tls:
    - hosts:
        - homeassistant-dev.nashes.uk
