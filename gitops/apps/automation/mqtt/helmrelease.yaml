apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mqtt
  namespace: automation
spec:
  values:
    defaultPodOptions:
      priorityClassName: apps-critical
      annotations:
        fluentbit.io/parser: mqtt
      securityContext:
        # image starts as root (entrypoint drops to the mosquitto user)
        runAsNonRoot: false
        fsGroup: 1000
    controllers:
      main:
        strategy: Recreate
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
            resources:
              requests:
                cpu: 100m
                memory: 250M
              limits:
                cpu: 200m
                memory: 500M
    # Fixed LB IP, so LAN devices survive a Service recreate. BIND external-dns
    # publishes mqtt.nashes.uk; mqtt.home is an OPNsense Unbound host override.
    service:
      app:
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 172.16.1.10
          external-dns.alpha.kubernetes.io/hostname: mqtt.nashes.uk
        ports:
          mqtt:
            port: 1883
    persistence:
      config:
        type: configMap
        name: mqtt-config
        globalMounts:
        - path: /mosquitto/config
      data:
        forceRename: mqtt-data
        retain: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
        - path: /mosquitto/data
    # LAN clients (ramses_esp, the SBS50, the laptop) reach the LB IP; HA uses the ClusterIP.
    # 172.16.0.0/24 holds the node IPs, so it also covers HA and traffic SNATed by another node.
    # No egress: the broker opens no connections.
    networkpolicies:
      main:
        controller: main
        policyTypes: [Ingress, Egress]
        rules:
          ingress:
          - from:
            - ipBlock: {cidr: 172.16.0.0/24}
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: frigate
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: zb2mqtt
            ports:
            - {protocol: TCP, port: 1883}
