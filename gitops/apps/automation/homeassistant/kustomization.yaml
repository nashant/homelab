apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: api-token.yaml and servicemonitor.yaml live in monitoring.
# The patch below puts the generated values ConfigMap beside the HelmRelease instead.
resources:
- ./api-token.yaml
- ./helmrelease.yaml
- ./servicemonitor.yaml
components:
- ../../../components/app-template-defaults
patches:
- target:
    kind: ConfigMap
    name: homeassistant-app-template-defaults
  patch: |
    - op: add
      path: /metadata/namespace
      value: automation

# Grafana's dashboard sidecar loads any ConfigMap labelled grafana_dashboard=1.
# Source: generated by the heatpump-assessment work (room temperature vs target).
configMapGenerator:
- name: homeassistant-room-heating-dashboard
  namespace: monitoring
  files:
  - room-heating.json=grafana-dashboard-room-heating.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
