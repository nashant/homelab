apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: api-token.yaml and servicemonitor.yaml live in monitoring.
# The patch below puts the generated values ConfigMap beside the HelmRelease instead.
resources:
- ./api-token.yaml
- ./helmrelease.yaml
- ./servicemonitor.yaml
components:
- ../../../components/app-template-defaults
patches:
- target:
    kind: ConfigMap
    name: homeassistant-app-template-defaults
  patch: |
    - op: add
      path: /metadata/namespace
      value: automation
