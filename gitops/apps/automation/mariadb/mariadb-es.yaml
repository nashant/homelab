apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: mariadb                    # consumed via secretKeyRef in deployment.yaml
    creationPolicy: Owner
    template:
      type: Opaque
  data:
  - secretKey: root-password
    remoteRef:
      key: /k8s/mariadb/root-password
