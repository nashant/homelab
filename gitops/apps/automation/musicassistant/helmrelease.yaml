apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: musicassistant
  namespace: automation
spec:
  values:
    defaultPodOptions:
      priorityClassName: apps-high
      annotations:
        fluentbit.io/parser: musicassistant
      # Players are found by mDNS and SSDP and fetch audio from the stream server, so the server
      # has to sit on the same layer 2 network as them. No NetworkPolicy applies to a hostNetwork
      # pod, and AirPlay opens random ports, so there is none.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        # image runs as root (no USER)
        runAsNonRoot: false
    controllers:
      main:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.9@sha256:4ac0d5844363fbbefd6a61251df09d96cd546e05e01b8c1cc1a28803f0935e07
            env:
              LOG_LEVEL: info
            resources:
              requests:
                cpu: 100m
                memory: 250Mi
              limits:
                cpu: 500m
                memory: 1Gi
    service:
      app:
        controller: main
        ports:
          http:
            port: 8095
          stream:
            port: 8097
    ingress:
      main:
        className: public-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-oauth2-proxy@kubernetescrd
          external-dns.alpha.kubernetes.io/target: home.nashes.uk
        hosts:
        - host: &nashes musicassistant.nashes.uk
          paths:
          - path: /
            pathType: ImplementationSpecific
            service:
              identifier: app
              port: http
        tls:
        - hosts: [*nashes]
    persistence:
      data:
        forceRename: musicassistant-data
        retain: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
        - path: /data
