# Default-deny for dev; each app gets only the peers seen in the 2026-10-28 traffic capture.
# Static nginx demos (not in git) behind private-traefik; no egress beyond DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-private-traefik
  namespace: dev
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: private-traefik
    ports:
    - {protocol: TCP, port: 8080}
