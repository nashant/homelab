# Flux entrypoint for this app. NOT listed in kustomization.yaml: the parent tree
# (apps/finance/kustomization.yaml) is where these get referenced once Flux syncs the repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sure
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./gitops/apps/finance/sure
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: home
  dependsOn:
  # the Flux Kustomization that applies platform/helmrepos (OCIRepository app-template)
  - name: helmrepos
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: sure
    namespace: finance
