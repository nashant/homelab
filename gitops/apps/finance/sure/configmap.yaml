apiVersion: v1
kind: ConfigMap
metadata:
  name: sure-env
  namespace: finance
  labels:
    app: sure
    part-of: sure
data:
  SELF_HOSTED: "true"
  RAILS_ENV: production
  # Traefik terminates TLS and forwards plaintext. ASSUME_SSL makes Rails generate https URLs
  # (needed for the OAuth/MCP discovery documents); FORCE_SSL would redirect-loop on the
  # in-cluster hop.
  RAILS_ASSUME_SSL: "true"
  RAILS_FORCE_SSL: "false"
  POSTGRES_USER: sure
  POSTGRES_DB: sure_production
  DB_HOST: sure-pg-rw          # CNPG primary (db.cluster.yaml)
  DB_PORT: "5432"
  REDIS_URL: redis://sure-redis:6379/1
  # Grants the MCP bearer token full access to this user's family data, including writes.
  MCP_USER_EMAIL: nash.ant@gmail.com
