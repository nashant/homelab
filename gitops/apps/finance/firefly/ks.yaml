# Flux entrypoint for this app. NOT listed in kustomization.yaml: the parent tree
# (apps/finance/kustomization.yaml) is where these get referenced once Flux syncs the repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firefly
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./gitops/apps/finance/firefly
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: home
  dependsOn:
  # the Flux Kustomization that applies platform/helmrepos (OCIRepository app-template; firefly-iii HelmRepository is in this dir)
  - name: helmrepos
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: firefly
    namespace: finance
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: firefly-importer
    namespace: finance
