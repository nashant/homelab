apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finance
resources:
- ./helmrelease.yaml
components:
- ../../../components/app-template-defaults

# No secret manifest and no database on purpose: the sync server keeps everything (including the
# server password) in SQLite under /data, so there is nothing to source from SSM. See the header
# comment in helmrelease.yaml.
