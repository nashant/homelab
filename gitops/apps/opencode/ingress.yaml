# LAN/VPN only (private-traefik — see netpolicy.yaml: ingress into the pod is
# allowed from the traefik namespace and the kubelet port-forward path, and
# nothing else). Deliberately NOT on public-traefik: this backend holds a
# near-cluster-admin ServiceAccount; keep its HTTP surface off the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode
  namespace: opencode
  labels:
    app: opencode
spec:
  ingressClassName: private-traefik
  rules:
  - host: &host opencode.nashes.uk
    http:
      paths:
      - pathType: ImplementationSpecific
        backend:
          service:
            name: opencode
            port:
              name: http
  tls:
  - hosts:
    - *host
